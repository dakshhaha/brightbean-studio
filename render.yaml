services:
  - type: web
    name: brightbean-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY_SALT
        generateValue: true
      - key: TURSO_URL
        value: "https://sal-instagram-dakshisoffline.aws-ap-south-1.turso.io"
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: STORAGE_BACKEND
        value: local
      - key: PLATFORM_INSTAGRAM_APP_ID
        value: "1586487600189525"
      - key: PLATFORM_INSTAGRAM_APP_SECRET
        value: "a5885b03f36e8bba42cb90d55dccdeab"

